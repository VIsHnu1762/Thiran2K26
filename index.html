
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillAgent Pro - Smart Bill Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "rgba(255, 255, 255, 0.1)",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
            },
          }
        }
      }
    </script>
    <style>
        :root {
            --background: 222 47% 6%;
            --foreground: 210 40% 98%;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #030712;
            color: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Deep Organic Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 0% 0%, #1e1b4b 0%, transparent 50%),
                        radial-gradient(circle at 100% 0%, #1e3a8a 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, #111827 0%, transparent 50%),
                        radial-gradient(circle at 0% 100%, #0f172a 0%, transparent 50%);
        }

        /* Liquid Glass Card */
        .glass-card {
            position: relative;
            overflow: hidden;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.02) 100%);
            pointer-events: none;
        }

        /* Global Toggle/Tap Effect */
        .tap-effect {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .tap-effect:active {
            transform: scale(0.95);
        }

        /* Gem Button */
        .gem-button {
            position: relative;
            overflow: hidden;
            border-radius: 9999px;
            background: #2563eb;
            font-weight: 600;
            color: white;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .gem-button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
        }
        
        .gem-button:active {
            transform: scale(0.94);
            background: #1d4ed8;
        }

        .gem-button::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.15), transparent);
            pointer-events: none;
        }

        .nav-glass {
            position: sticky;
            top: 1.5rem;
            z-index: 50;
            margin: 0 1.5rem;
            border-radius: 2.5rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(32px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="dark">
    <div class="mesh-bg"></div>
    <!-- Background Blobs -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-1 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px] animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[100px] animate-blob" style="animation-delay: 2s"></div>
        <div class="absolute top-[30%] right-[10%] w-[30%] h-[30%] bg-indigo-600/10 rounded-full blur-[80px] animate-blob" style="animation-delay: 4s"></div>
    </div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
