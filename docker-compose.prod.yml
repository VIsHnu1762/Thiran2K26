# =============================================================================
# BillAgent Pro - Production Docker Compose
# =============================================================================
# Production deployment with optimized settings, health checks, and monitoring
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d          # Start production stack
#   docker-compose -f docker-compose.prod.yml down           # Stop all services
#   docker-compose -f docker-compose.prod.yml logs -f        # View logs
#   docker-compose -f docker-compose.prod.yml ps             # Check status
#
# Prerequisites:
#   - Copy .env.example to .env and configure production values
#   - Generate strong passwords for all services
#   - Configure SSL certificates (optional, handled by load balancer)
# =============================================================================

version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # Frontend (Nginx + React)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ENVIRONMENT: production
    container_name: billagent_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - billagent_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI + Uvicorn)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: billagent_backend
    restart: always
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-billagent}
      POSTGRES_USER: ${POSTGRES_USER:-billagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Application
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # OCR APIs
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bill_uploads:/app/uploads
      - bill_storage:/app/storage
    networks:
      - billagent_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: billagent_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billagent}
      POSTGRES_USER: ${POSTGRES_USER:-billagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_backups:/backups
    networks:
      - billagent_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billagent} -d ${POSTGRES_DB:-billagent}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    # Security: Don't expose port in production (only internal)
    # ports:
    #   - "5432:5432"

    # ---------------------------------------------------------------------------
    # Redis (Task Queue & Caching)
    # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: billagent_redis
    restart: always
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - billagent_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Celery Worker (Bill Processing)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: billagent_celery_worker
    restart: always
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,bills,ocr
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-billagent}
      POSTGRES_USER: ${POSTGRES_USER:-billagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Application
      ENVIRONMENT: production
      # OCR APIs
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - bill_uploads:/app/uploads
      - bill_storage:/app/storage
    networks:
      - billagent_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery Beat (Scheduled Tasks)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: billagent_celery_beat
    restart: always
    command: celery -A celery_app beat --loglevel=info
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-billagent}
      POSTGRES_USER: ${POSTGRES_USER:-billagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - billagent_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Database Backup Service (pg_dump scheduled)
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:15-alpine
    container_name: billagent_backup
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-billagent}
      PGUSER: ${POSTGRES_USER:-billagent}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_backups:/backups
    networks:
      - billagent_network
    entrypoint: >
      /bin/sh -c "
        pg_dump -Fc > /backups/billagent_$$(date +%Y%m%d_%H%M%S).dump &&
        echo 'Backup completed successfully' &&
        find /backups -name '*.dump' -mtime +7 -delete &&
        echo 'Old backups cleaned up'
      "
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  bill_uploads:
    driver: local
  bill_storage:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  billagent_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
