# =============================================================================
# ESLint Configuration - BillAgent Pro
# =============================================================================

root: true

env:
  browser: true
  es2022: true
  node: true

extends:
  - eslint:recommended
  - plugin:@typescript-eslint/recommended
  - plugin:react-hooks/recommended

ignorePatterns:
  - dist
  - node_modules
  - coverage
  - "*.config.js"
  - "*.config.ts"

parser: "@typescript-eslint/parser"

parserOptions:
  ecmaVersion: latest
  sourceType: module
  ecmaFeatures:
    jsx: true

plugins:
  - react-refresh
  - "@typescript-eslint"

rules:
  # React
  react-refresh/only-export-components:
    - warn
    - allowConstantExport: true

  # TypeScript
  "@typescript-eslint/no-unused-vars":
    - warn
    - argsIgnorePattern: "^_"
      varsIgnorePattern: "^_"
  "@typescript-eslint/no-explicit-any": warn
  "@typescript-eslint/explicit-function-return-type": off
  "@typescript-eslint/explicit-module-boundary-types": off
  "@typescript-eslint/no-non-null-assertion": warn

  # General
  no-console:
    - warn
    - allow:
        - warn
        - error
  prefer-const: error
  no-var: error
  eqeqeq:
    - error
    - always
    - "null": ignore

settings:
  react:
    version: detect
